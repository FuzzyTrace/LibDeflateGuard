# Run test
name: lua_test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

  workflow_dispatch:

jobs:
  lua_test_win:
    strategy:
      fail-fast: false
      matrix:
        LUA:
          [
            "lua-5.1.5",
            "lua-5.2.4",
            "lua-5.3.6",
            "lua-5.4.3",
            "luajit-2.0.5",
            "luajit-2.1.0-beta3",
          ]
        os: ["windows-2022"]
    runs-on: ${{ matrix.os }}
    env:
      LUA: ${{ matrix.LUA }}
      LUAROCKS: 3.13.0
    steps:
      - uses: actions/checkout@v7

      - name: Install GNU Make
        run: choco install make --version=4.3 -y --allowdowngrade

      - name: Install Mingw
        run: choco install mingw --version=8.1.0 -y --allowdowngrade

      - name: Install Lua and Luarocks
        run: env "LUA=${LUA}" "LUAROCKS=${LUAROCKS}" .github/workflows/script/install_lua_luarocks.sh
        shell: bash

      - name: Install reference compressor (zdeflate, puff)
        run: .github/workflows/script/install_compressor.sh
        shell: bash

      - name: Test if example work
        run: |
          . .github/workflows/script/setenv_lua.ps1
          lua -v
          lua examples/example.lua

      - name: Run focused guard tests
        run: |
          . .github/workflows/script/setenv_lua.ps1
          lua tests/GuardTest.lua

      - name: Run randomized decode-path tests
        run: |
          . .github/workflows/script/setenv_lua.ps1
          lua tests/FuzzTest.lua

      - name: Install luaunit
        run: |
          . .github/workflows/script/setenv_lua.ps1
          # Same missing retry as the unix job: luarocks fetches the rockspec
          # from luarocks.org itself and does not retry, and a transient
          # failure there crashes LuaRocks inside its own error path rather
          # than reporting a network error. luarocks is a native command, so
          # failure sets LASTEXITCODE instead of throwing.
          foreach ($attempt in 1..5) {
            luarocks install luaunit 3.4-1
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Host "luarocks install failed on attempt $attempt"
            Start-Sleep -Seconds ($attempt * 10)
          }
          Write-Host "luarocks install luaunit failed after 5 attempts"
          exit 1

      - name: Run tests
        run: |
          . .github/workflows/script/setenv_lua.ps1
          lua -v
          lua tests/Test.lua --verbose --shuffle

  lua_test_unix:
    strategy:
      fail-fast: false
      matrix:
        LUA:
          [
            "lua-5.1.5",
            "lua-5.2.4",
            "lua-5.3.6",
            "lua-5.4.3",
            "luajit-2.0.5",
            "luajit-2.1.0-beta3",
          ]
        os: ["ubuntu-24.04", "macos-15-intel"]
    runs-on: ${{ matrix.os }}
    env:
      LUA: ${{ matrix.LUA }}
      LUAROCKS: 3.13.0
    steps:
      - uses: actions/checkout@v7

      - name: Install Lua and Luarocks
        run: sudo env "LUA=${LUA}" "LUAROCKS=${LUAROCKS}" .github/workflows/script/install_lua_luarocks.sh

      - name: Install reference compressor (zdeflate, puff)
        run: .github/workflows/script/install_compressor.sh

      - name: Test if example works
        run: |
          set -exuo pipefail
          source .github/workflows/script/setenv_lua.sh
          lua examples/example.lua

      - name: Run focused guard tests
        run: |
          set -exuo pipefail
          source .github/workflows/script/setenv_lua.sh
          lua tests/GuardTest.lua

      - name: Run randomized decode-path tests
        run: |
          set -exuo pipefail
          source .github/workflows/script/setenv_lua.sh
          lua tests/FuzzTest.lua

      - name: Install luaunit
        run: |
          sudo env "GITHUB_WORKSPACE=${GITHUB_WORKSPACE}" bash -c '
            set -euxo pipefail
            source .github/workflows/script/setenv_lua.sh
            # luarocks fetches the rockspec from luarocks.org itself and does
            # not retry. A transient failure there does not surface as a clean
            # network error either: LuaRocks 3.13.0 crashes in its own error
            # path with "attempt to concatenate local (a nil value)", which
            # has flaked the macOS runners. Every other download in CI already
            # passes --retry to curl; this was the one that did not.
            for attempt in 1 2 3 4 5; do
              if luarocks install --deps-mode none luaunit 3.4-1; then
                exit 0
              fi
              echo "luarocks install failed on attempt ${attempt}"
              sleep $((attempt * 10))
            done
            echo "luarocks install luaunit failed after 5 attempts" >&2
            exit 1
          '

      - name: Run tests
        run: |
          set -exuo pipefail
          source .github/workflows/script/setenv_lua.sh
          lua -v
          lua tests/Test.lua --verbose --shuffle
